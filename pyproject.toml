[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nowri"
version = "0.1.1"
description = "Nigerian Oil-Water Risk Intelligence: reproducible geospatial screening of oil and gas infrastructure proximity to mapped rivers (Niger Delta pilot)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "geopandas>=1.0", "shapely>=2.0", "pyproj>=3.6", "pyogrio>=0.9",
  "pandas>=2.0", "numpy>=1.26", "requests>=2.31", "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
