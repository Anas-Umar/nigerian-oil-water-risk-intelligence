name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Unit and geometry tests
        run: python -m pytest -q
      - name: Data policy check (no third-party data in the repository)
        run: python tools/check_no_data.py
